<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hello VK Mini App</title>
<style>
  :root {
    --vk-blue: #0077FF;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1e1e1e;
    --muted: #818c99;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: var(--vk-blue);
    color: white;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  button {
    background: var(--vk-blue);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button:active { opacity: 0.85; }
  .result {
    margin-top: 16px;
    padding: 12px;
    border-radius: 10px;
    background: #eef4ff;
    font-size: 14px;
    min-height: 20px;
    display: none;
    word-break: break-word;
  }
  .result.show { display: block; }
  .status {
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">VK Mini App</span>
    <h1>Привет, мир! 👋</h1>
    <p class="sub">Это тестовое мини-приложение для ВКонтакте.</p>
    <button id="getUserBtn">Показать моё имя из VK</button>
    <div class="result" id="result"></div>
    <div class="status" id="status">Инициализация…</div>
  </div>

  <!-- VK Bridge — JS-SDK для связи страницы с клиентом VK -->
  <script src="https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2/dist/browser.min.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const btn = document.getElementById('getUserBtn');

    // Обязательный вызов: сообщаем клиенту VK, что страница загрузилась
    // и готова показываться (иначе VK будет держать экран загрузки).
    async function init() {
      try {
        await vkBridge.send('VKWebAppInit');
        statusEl.textContent = 'Готово — запущено внутри VK.';
      } catch (e) {
        // Если открыть этот файл просто в браузере (не через vk.com/app...),
        // vkBridge не сможет связаться с клиентом VK — это ожидаемо.
        statusEl.textContent = 'Открыто вне ВК — часть функций работать не будет.';
      }
    }

    // Пример вызова VK API прямо из мини-аппа
    btn.addEventListener('click', async () => {
      resultEl.classList.add('show');
      resultEl.textContent = 'Запрашиваю данные...';
      try {
        const user = await vkBridge.send('VKWebAppGetUserInfo');
        resultEl.textContent = `Привет, ${user.first_name} ${user.last_name}!`;
      } catch (e) {
        resultEl.textContent = 'Не удалось получить данные (это нормально, если страница открыта не внутри VK).';
      }
    });

    init();
  </script>
</body>
</html>
